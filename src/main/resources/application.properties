server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hostel_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-string-123456}
app.cors.origins=${FRONTEND_URL:*}
app.admin.email=${ADMIN_EMAIL:admin@hostel.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
